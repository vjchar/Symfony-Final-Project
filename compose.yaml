services:
  vj-mysql:
    image: mysql:8.0
    container_name: vj-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3310:3306"
    volumes:
      - vj-db-data:/var/lib/mysql
    networks:
      - vj-network

  vj-phpmyadmin:
    image: phpmyadmin
    container_name: vj-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: vj-mysql
    ports:
      - "8081:80"
    networks:
      - vj-network

volumes:
  vj-db-data:

networks:
  vj-network:
